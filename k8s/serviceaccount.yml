apiVersion: v1
kind: ServiceAccount
metadata:
  name: feature-service
  namespace: feature-service
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: feature-service-role
  namespace: feature-service
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: feature-service-rolebinding
  namespace: feature-service
subjects:
- kind: ServiceAccount
  name: feature-service
  namespace: feature-service
roleRef:
  kind: Role
  name: feature-service-role
  apiGroup: rbac.authorization.k8s.io
