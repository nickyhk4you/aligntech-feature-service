spring:
  application:
    name: feature-service
  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/feature_service
    username: aligntech
    password: ${DB_PASSWORD:aligntech}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis

  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  api-key: ${API_KEY:}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      app: feature-service
  tracing:
    sampling:
      probability: 0.1
