version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: feature-service-postgres
    environment:
      POSTGRES_DB: feature_service
      POSTGRES_USER: aligntech
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aligntech"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - feature-service-network

  redis:
    image: redis:7-alpine
    container_name: feature-service-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - feature-service-network

  feature-service:
    build:
      context: .
      dockerfile: service/Dockerfile
    container_name: feature-service
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/feature_service
      SPRING_DATASOURCE_USERNAME: aligntech
      SPRING_DATASOURCE_PASSWORD: postgres_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      DB_PASSWORD: postgres_password
      API_KEY: dev-api-key-12345
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - feature-service-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: feature-service-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - feature-service-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: feature-service-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - feature-service-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  feature-service-network:
    driver: bridge
